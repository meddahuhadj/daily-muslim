# Blueprint Render — Daily Muslim Life Assistant (déploiement gratuit).
# Une seule instance persistante (WebSockets longs + état en mémoire).
#
# Déploiement en 3 étapes :
#   1. Pousser ce dépôt sur GitHub (public ou privé).
#   2. dashboard.render.com → « New » → « Blueprint » → sélectionner le dépôt.
#   3. Renseigner les secrets (GEMINI_API_KEY) dans « Environment ».
#
# Alternative équivalente : imposer ce Dockerfile sur Railway / Fly.io / un VPS.
services:
  - type: web
    name: daily-muslim
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    envVars:
      # Secret réglé dans le dashboard Render (jamais commité) :
      - key: GEMINI_API_KEY
        sync: false
      # Modèle Gemini. Le quota gratuit de gemini-2.5-flash est vite atteint ;
      # gemini-2.5-flash-lite a un quota gratuit plus large. Surchargeable dans
      # le dashboard Render (Environment).
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      # Facultatif : langues traduites par défaut (ex: "fr,en,nl")
      - key: DEFAULT_TARGET_LANGS
        sync: false
      # Facultatif : URL publique utilisée pour les liens/QR
      # (ex: https://daily-muslim.onrender.com)
      - key: PUBLIC_BASE_URL
        sync: false